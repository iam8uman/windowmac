name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Website and docs changes don't touch the app, so they shouldn't build, notarize
    # or publish it. (Path filters don't apply to tag pushes; run the workflow by hand
    # to release after a docs-only push.)
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**.md"
      - "vercel.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Paused while Apple's first notarization is pending: CI doesn't notarize or
  # publish releases. Notarize by hand, then set this back to "true".
  NOTARIZE_IN_CI: "false"

# Only one build of main at a time, so two pushes can't notarize side by side.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Compile
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee compile.log || {
            # Report every compiler error in one annotation so it's readable from the API.
            grep -E "^[^ ].*error:" compile.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -80 > errors.txt
            echo "::error title=Compile errors::$(awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}' errors.txt)"
            exit 1
          }

      - name: Unit tests
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee test.log || {
            grep -E "error|failed" test.log | sort -u | head -60 > failures.txt
            echo "::error title=Test failures::$(awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}' failures.txt)"
            exit 1
          }

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Release when main carries a version that hasn't been released yet (or when a v* tag is pushed).
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" != "pull_request" ]] && ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $VERSION"

      # Signs with the Developer ID certificate when the secrets are set (main/tags only;
      # forks and PRs don't get secrets and fall back to an ad-hoc signed build).
      - name: Import the Developer ID certificate
        id: signing
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${P12_BASE64:-}" ]]; then
            echo "No Developer ID secrets, building ad-hoc signed"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')
          [[ -n "$IDENTITY" ]] || { echo "::error title=Signing::No 'Developer ID Application' identity in the .p12"; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build Windowmac.app
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: VERSION="${{ steps.version.outputs.version }}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/build-app.sh

      - name: Smoke test the app
        run: |
          set -euo pipefail
          APP=build/Windowmac.app
          BIN=$APP/Contents/MacOS/Windowmac
          plutil -lint $APP/Contents/Info.plist
          echo "Architectures: $(lipo -archs $BIN)"
          lipo -archs $BIN | grep -q arm64
          lipo -archs $BIN | grep -q x86_64
          codesign --verify --deep --strict $APP
          $BIN --version
          COUNT=$($BIN --list | grep -c '^windowmac://')
          echo "windowmac:// commands: $COUNT"
          test "$COUNT" -gt 60
          # Launch the real app and make sure it stays up (no Accessibility on CI, so it waits for permission).
          $BIN > launch.log 2>&1 &
          PID=$!
          sleep 10
          if kill -0 $PID 2>/dev/null; then
            echo "Windowmac launched and is still running after 10s"
            kill $PID
          else
            echo "::error title=Launch crash::Windowmac exited during launch: $(tail -20 launch.log | tr '\n' ' ')"
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -3
            exit 1
          fi

      # Apple scans the signed app and issues a ticket; stapling it to the app means
      # Gatekeeper opens it with no warning, even offline.
      - name: Notarize
        id: notarize
        if: env.NOTARIZE_IN_CI == 'true' && steps.signing.outputs.signed == 'true' && steps.version.outputs.release == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY"
          # One submission at a time: if Apple is still working on an earlier one,
          # stop here rather than queue another copy behind it.
          PENDING=$(xcrun notarytool history --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --output-format json \
            | /usr/bin/python3 -c 'import json,sys;print(" ".join(e["id"] for e in json.load(sys.stdin)["history"] if e["status"]=="In Progress"))')
          if [[ -n "$PENDING" ]]; then
            rm -f "$KEY"
            echo "::error title=Notarization::Not submitting: Apple is still processing $PENDING. Re-run once it finishes."
            exit 1
          fi
          ditto -c -k --keepParent build/Windowmac.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee notary.json
          rm -f "$KEY"
          STATUS=$(/usr/bin/python3 -c 'import json;print(json.load(open("notary.json"))["status"])')
          if [[ "$STATUS" != "Accepted" ]]; then
            ID=$(/usr/bin/python3 -c 'import json;print(json.load(open("notary.json"))["id"])')
            echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY"
            xcrun notarytool log "$ID" --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            rm -f "$KEY"
            echo "::error title=Notarization::Apple returned $STATUS"
            exit 1
          fi
          xcrun stapler staple build/Windowmac.app
          spctl --assess --type execute --verbose=2 build/Windowmac.app
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Windowmac.app Windowmac.zip
          shasum -a 256 Windowmac.zip | tee Windowmac.zip.sha256

      - name: Release notes
        if: steps.version.outputs.release == 'true'
        run: |
          {
            echo '**Download `Windowmac.zip`**, unzip it and drag Windowmac into Applications. Works on macOS 13+ (Apple silicon and Intel).'
            echo
            if [[ "${{ steps.notarize.outputs.notarized }}" == "true" ]]; then
              echo 'Signed with a Developer ID and notarized by Apple, so it opens like any other app. Allow Accessibility when asked, hold **Left ⌥ (Option)** and flick the mouse.'
            else
              echo "Windowmac isn't notarized yet, so the first time you open it macOS asks first. On macOS 15: System Settings → Privacy & Security → **Open Anyway**. On macOS 13–14: right-click Windowmac → **Open**. Then allow Accessibility when asked, hold **Left ⌥ (Option)** and flick the mouse."
            fi
          } > build/release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windowmac
          path: build/Windowmac.zip

      - name: Publish release
        if: env.NOTARIZE_IN_CI == 'true' && steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Windowmac ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            build/Windowmac.zip
            build/Windowmac.zip.sha256
          generate_release_notes: true
          body_path: build/release-notes.md
